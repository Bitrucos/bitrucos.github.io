<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Bricolage";src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2");font-weight:800}
@font-face{font-family:"Figtree";src:url(fonts/figtree-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:"Figtree";src:url(fonts/figtree-latin-800-normal.woff2) format("woff2");font-weight:800}
@font-face{font-family:"JBMono";src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2");font-weight:500}
:root{--bg:#12130F;--paper:#F4F1E8;--lime:#C8F031;--coral:#FF5B2E;--ink:#2B2118;--muted:#8E907F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
body{font-family:"Figtree";font-weight:800;color:var(--paper);position:relative}
.scene{position:absolute;inset:0;overflow:hidden;visibility:hidden}
.cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:50% 45%}
.abs{position:absolute}
svg.full{position:absolute;left:0;top:0;width:1920px;height:1080px}
.chip{position:absolute;left:56px;top:48px;display:flex;gap:12px;align-items:center;padding:12px 26px;border-radius:999px;background:rgba(18,19,15,.74);border:1px solid rgba(244,241,232,.16);font-weight:800;font-size:28px;letter-spacing:.02em;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:4}
.chip i{display:block;width:13px;height:13px;background:var(--lime)}
.chip.c{border-color:rgba(255,91,46,.5)} .chip.c i{background:var(--coral)}
.bokeh{position:absolute;border-radius:50%;filter:blur(20px)}
/* objetos */
.app{display:flex;align-items:center;gap:20px;padding:18px 28px 18px 18px;border-radius:28px;background:linear-gradient(170deg,#F5ECD8,#E2D2B0);box-shadow:0 26px 60px rgba(0,0,0,.5);color:var(--ink)}
.app .ico{width:88px;height:88px;border-radius:22px;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.app .ico svg{width:56px;height:56px}
.app .nm{font-family:"Bricolage";font-weight:800;font-size:46px;line-height:1;letter-spacing:-.01em;white-space:nowrap}
.app .sb{font-weight:800;font-size:26px;color:#7A6650;margin-top:8px;white-space:nowrap}
.app.col{flex-direction:column;text-align:center;padding:26px 20px 24px;gap:14px}
.ptag{border-radius:22px;box-shadow:0 30px 70px rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
.ptag .hole{position:absolute;top:16px;left:50%;margin-left:-11px;width:22px;height:22px;border-radius:50%;background:#12130F;box-shadow:inset 0 0 0 4px #8E907F}
.ptag .pbig{font-family:"Bricolage";font-weight:800;font-size:96px;line-height:1;letter-spacing:-.03em;margin-top:22px}
.ptag .psub{font-weight:800;font-size:28px;color:#7A6650;letter-spacing:.04em}
.pill{position:absolute;display:inline-flex;align-items:center;gap:14px;border-radius:999px;padding:14px 32px;font-weight:800;font-size:36px;letter-spacing:.04em;white-space:nowrap}
.pill.l{background:var(--lime);color:#12130F;box-shadow:0 0 50px rgba(200,240,49,.35)}
.pill.c{background:rgba(255,91,46,.14);border:3px solid rgba(255,91,46,.7);color:var(--coral)}
.pill.cs{background:var(--coral);color:#12130F;box-shadow:0 0 50px rgba(255,91,46,.45)}
.pill.d{background:rgba(18,19,15,.82);border:2px solid rgba(244,241,232,.18);color:var(--paper)}
.pill.p{background:var(--paper);color:#12130F;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.bt{font-family:"Bricolage";font-weight:800;line-height:.95;letter-spacing:-.03em;white-space:nowrap}
.paper{background:linear-gradient(175deg,#FBF7EC,#ECE3CF);border-radius:10px;box-shadow:0 30px 70px rgba(0,0,0,.55);color:var(--ink);overflow:hidden}
.paper .ttl{font-family:"Bricolage";font-weight:800;font-size:34px;padding:26px 30px 10px}
.paper .ln{height:12px;border-radius:6px;background:#CBBF9F;margin:16px 30px 0}
.win{background:#1E211A;border:1px solid rgba(244,241,232,.12);border-radius:22px;box-shadow:0 40px 90px rgba(0,0,0,.6);overflow:hidden}
.win .bar{height:58px;background:#2A2D24;display:flex;align-items:center;gap:12px;padding:0 22px;font-family:"JBMono";font-weight:500;font-size:24px;color:var(--muted)}
.win .bar b{display:block;width:16px;height:16px;border-radius:50%;background:#4A4D42}
.bub{position:absolute;border-radius:30px 30px 30px 8px;background:#2A2C24;border:1px solid rgba(244,241,232,.1);padding:22px 30px;font-weight:600;font-size:32px;line-height:1.3;color:var(--paper)}
.bub.me{border-radius:30px 30px 8px 30px;background:#2F3A14;border-color:rgba(200,240,49,.35)}
.mono{font-family:"JBMono";font-weight:500}
.tbox{position:absolute;border-radius:26px;background:#22251D;border:2px solid rgba(200,240,49,.35);padding:26px 32px;font-family:"JBMono";font-weight:500;font-size:30px;line-height:1.45;color:var(--paper);box-shadow:0 30px 70px rgba(0,0,0,.5)}
.caret{display:inline-block;width:14px;height:34px;background:var(--lime);vertical-align:-6px;margin-left:3px}
.track{position:absolute;height:34px;border-radius:17px;background:rgba(244,241,232,.12);overflow:hidden;box-shadow:inset 0 0 0 2px rgba(244,241,232,.1)}
.track .fl{position:absolute;left:0;top:0;bottom:0;border-radius:17px;width:0}
.strike{position:absolute;height:10px;border-radius:5px;background:var(--coral);transform-origin:0 50%;box-shadow:0 0 20px rgba(255,91,46,.6)}
.ej{position:absolute;font-weight:600;font-size:22px;color:var(--muted);letter-spacing:.04em}
.lbl{font-weight:800;font-size:30px;white-space:nowrap}
.logo{font-family:"Bricolage";font-weight:800;font-size:200px;letter-spacing:-.03em;position:relative;line-height:1}
.logo .i{position:relative;display:inline-block}
.logo .px{position:absolute;width:40px;height:40px;background:var(--lime);left:50%;margin-left:-20px;top:-6px}
.logo .sp{position:absolute;width:46px;height:46px;left:50%;margin-left:14px;top:-46px}
#prog{position:absolute;left:0;top:0;height:8px;background:var(--lime);z-index:30}
#capbg{position:absolute;left:0;right:0;top:800px;height:280px;background:linear-gradient(rgba(10,10,8,0),rgba(10,10,8,.7) 40%,rgba(10,10,8,.78));z-index:20}
#cap{position:absolute;left:150px;right:150px;top:892px;height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:50px;line-height:1.2;z-index:21}
#cap .w{display:inline-block;margin:0 .12em;position:relative;color:rgba(244,241,232,.74)}
#cap .w.now{color:#fff;text-shadow:0 0 24px rgba(255,255,255,.35)}
#cap .w.k{color:#fff}
#cap .w .box{position:absolute;left:-9px;right:-9px;top:2px;bottom:-2px;border:3px solid var(--lime);border-radius:6px;box-shadow:0 0 18px rgba(200,240,49,.35)}
#cap .w .box b{position:absolute;width:11px;height:11px;background:var(--lime);border-radius:2px}
#dust{position:absolute;inset:0;z-index:15;pointer-events:none}
#dust i{position:absolute;border-radius:50%;background:#FFE2B0}
#vig{position:absolute;inset:0;z-index:16;background:radial-gradient(ellipse 78% 70% at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
#cover{position:absolute;inset:0;z-index:50;background:radial-gradient(ellipse 70% 80% at 30% 40%,#24271C,#12130F 70%);overflow:hidden}
.clogo{font-family:"Bricolage";font-weight:800;font-size:64px;letter-spacing:-.03em;line-height:1;position:absolute}
.clogo .i{position:relative;display:inline-block}
.clogo .px{position:absolute;width:14px;height:14px;background:var(--lime);left:50%;margin-left:-7px;top:-2px}
.clogo .sp{position:absolute;width:18px;height:18px;left:50%;margin-left:5px;top:-16px}
</style>
</head>
<body>
<div id="prog"></div>
<div id="stage"></div>
<div id="dust"></div>
<div id="vig"></div>
<div id="capbg"></div><div id="cap"></div>
<div id="cover"></div>
<script>window.VW=1920; window.VH=1080;</script>
<script src="timing.js"></script>
<script>
const T=window.TIMING, D=T.duration, L=T.lines;
window.DUR=D;
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const back=(x,s=1.4)=>{x=clamp(x)-1;return 1+(s+1)*x*x*x+s*x*x;};
const P=(t,a,d)=>clamp((t-a)/d);
function rng(seed){ let r=seed; return ()=>{ r=(r*16807)%2147483647; return r/2147483647; }; }
const QS=new URLSearchParams(location.search);

// ================= timing =================
const NS=L.length, sceneStart={}, sceneEnd={};
L.forEach(l=>{ sceneStart[l.scene]= l.scene===1?0:Math.max(0,l.start-0.4); });
for(let s=1;s<=NS;s++) sceneEnd[s]= s<NS? sceneStart[s+1] : D;
function wtn(scene,word,n=1){ const l=L.find(x=>x.scene===scene); let c=0;
  for(const sg of l.segs){ let from=0; while(true){ const i=sg.show.indexOf(word,from); if(i<0) break; c++; if(c===n){ const k=sg.show.slice(0,i).split(' ').length-1; return sg.ws?sg.ws[k]:sg.start; } from=i+1; } }
  throw new Error('palabra "'+word+'" #'+n+' no está en la escena '+scene); }
function sEnd(scene,i){ const l=L.find(x=>x.scene===scene); return i<0? l.segs[l.segs.length+i].end : l.segs[i].end; }
function specT(s,spec){ if(spec[0]==='+') return sceneStart[s]+parseFloat(spec.slice(1)); if(spec.startsWith('end')) return sEnd(s,-1)+parseFloat(spec.slice(3)||0);
  const [w,n]=spec.split('#'); return wtn(s,w,+(n||1)); }

// ================= helpers de dibujo =================
const A=(at,a='spawn',x='')=>` data-at="${at}" data-a="${a}" ${x}`;
const st=(x,y,w,h)=>`left:${x}px;top:${y}px;${w!=null?`width:${w}px;`:''}${h!=null?`height:${h}px;`:''}`;
const ICON={
 chat:c=>`<svg viewBox="0 0 100 100"><path d="M16 22h68a8 8 0 0 1 8 8v36a8 8 0 0 1-8 8H42L24 88V74h-8a8 8 0 0 1-8-8V30a8 8 0 0 1 8-8z" fill="none" stroke="${c}" stroke-width="8" stroke-linejoin="round"/><circle cx="34" cy="48" r="6" fill="${c}"/><circle cx="50" cy="48" r="6" fill="${c}"/><circle cx="66" cy="48" r="6" fill="${c}"/></svg>`,
 burst:c=>`<svg viewBox="0 0 100 100"><g stroke="${c}" stroke-width="11" stroke-linecap="round">${[0,45,90,135].map(a=>`<path d="M50 12V88" transform="rotate(${a} 50 50)"/>`).join('')}</g><circle cx="50" cy="50" r="12" fill="${c}"/></svg>`,
 star:c=>`<svg viewBox="0 0 100 100"><path d="M50 4 C54 34 66 46 96 50 C66 54 54 66 50 96 C46 66 34 54 4 50 C34 46 46 34 50 4Z" fill="${c}"/></svg>`,
 mail:c=>`<svg viewBox="0 0 100 100"><rect x="10" y="22" width="80" height="58" rx="8" fill="none" stroke="${c}" stroke-width="8"/><path d="M12 26l38 30 38-30" fill="none" stroke="${c}" stroke-width="8" stroke-linejoin="round"/></svg>`,
 folder:c=>`<svg viewBox="0 0 100 100"><path d="M10 26a6 6 0 0 1 6-6h22l8 10h38a6 6 0 0 1 6 6v40a6 6 0 0 1-6 6H16a6 6 0 0 1-6-6z" fill="${c}"/></svg>`,
 doc:c=>`<svg viewBox="0 0 100 100"><path d="M24 8h36l20 20v62a4 4 0 0 1-4 4H24a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4z" fill="${c}"/><path d="M32 44h36M32 58h36M32 72h24" stroke="#12130F" stroke-width="6" stroke-linecap="round" opacity=".55"/></svg>`,
 image:c=>`<svg viewBox="0 0 100 100"><rect x="10" y="16" width="80" height="68" rx="8" fill="none" stroke="${c}" stroke-width="8"/><path d="M16 78l24-28 16 18 10-10 18 20" fill="none" stroke="${c}" stroke-width="7" stroke-linejoin="round"/><circle cx="68" cy="36" r="8" fill="${c}"/></svg>`,
 search:c=>`<svg viewBox="0 0 100 100"><circle cx="42" cy="42" r="26" fill="none" stroke="${c}" stroke-width="9"/><path d="M62 62l24 24" stroke="${c}" stroke-width="11" stroke-linecap="round"/></svg>`,
 mic:c=>`<svg viewBox="0 0 100 100"><rect x="36" y="10" width="28" height="50" rx="14" fill="${c}"/><path d="M24 46a26 26 0 0 0 52 0M50 72v16M36 90h28" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round"/></svg>`,
 clip:c=>`<svg viewBox="0 0 100 100"><path d="M68 34L40 62a8 8 0 0 0 11 11l30-30a16 16 0 0 0-23-23L26 52a24 24 0 0 0 34 34l22-22" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round"/></svg>`,
 bars:c=>`<svg viewBox="0 0 100 100"><path d="M18 86V56M40 86V30M62 86V44M84 86V16" stroke="${c}" stroke-width="12" stroke-linecap="round"/></svg>`,
 brain:c=>`<svg viewBox="0 0 100 100"><path d="M50 18v66M50 22c-8-10-30-8-30 10-12 4-12 22 0 26-4 16 14 26 30 18M50 22c8-10 30-8 30 10 12 4 12 22 0 26 4 16-14 26-30 18" fill="none" stroke="${c}" stroke-width="7" stroke-linejoin="round"/></svg>`,
 lock:c=>`<svg viewBox="0 0 100 100"><rect x="20" y="44" width="60" height="44" rx="8" fill="${c}"/><path d="M32 44V32a18 18 0 0 1 36 0v12" fill="none" stroke="${c}" stroke-width="9"/></svg>`,
 check:c=>`<svg viewBox="0 0 100 100"><path d="M18 52l22 22 44-46" fill="none" stroke="${c}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
 cross:c=>`<svg viewBox="0 0 100 100"><path d="M24 24l52 52M76 24L24 76" stroke="${c}" stroke-width="12" stroke-linecap="round"/></svg>`,
 globe:c=>`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="${c}" stroke-width="7"/><path d="M12 50h76M50 12c-16 20-16 56 0 76M50 12c16 20 16 56 0 76" fill="none" stroke="${c}" stroke-width="6"/></svg>`,
 plane:c=>`<svg viewBox="0 0 100 100"><path d="M8 54l84-30-30 64-12-26z" fill="${c}"/><path d="M50 62l42-38" stroke="#12130F" stroke-width="4" opacity=".4"/></svg>`,
 sheet:c=>`<svg viewBox="0 0 100 100"><rect x="14" y="14" width="72" height="72" rx="8" fill="${c}"/><path d="M14 38h72M14 62h72M40 14v72" stroke="#12130F" stroke-width="5" opacity=".45"/></svg>`,
 pot:c=>`<svg viewBox="0 0 100 100"><path d="M18 46h64l-6 34a8 8 0 0 1-8 6H32a8 8 0 0 1-8-6z" fill="${c}"/><path d="M12 46h76M38 34c-4-8 4-12 0-20M56 34c-4-8 4-12 0-20" stroke="${c}" stroke-width="7" stroke-linecap="round" fill="none"/></svg>`,
 store:c=>`<svg viewBox="0 0 100 100"><path d="M14 40l8-24h56l8 24M18 40v44h64V40" fill="none" stroke="${c}" stroke-width="8" stroke-linejoin="round"/><rect x="40" y="58" width="20" height="26" fill="${c}"/></svg>`,
 card:c=>`<svg viewBox="0 0 100 100"><rect x="8" y="22" width="84" height="56" rx="9" fill="${c}"/><rect x="8" y="34" width="84" height="12" fill="#12130F" opacity=".45"/><rect x="18" y="58" width="22" height="9" rx="3" fill="#12130F" opacity=".35"/></svg>`,
};
const APPS={chatgpt:{name:'ChatGPT',bg:'#183A30',fg:'#7FE0B8',icon:'chat'},claude:{name:'Claude',bg:'#3E2416',fg:'#F2915F',icon:'burst'},gemini:{name:'Gemini',bg:'#1A2550',fg:'#9DB8FF',icon:'star'}};
function app(k,x,y,an='',sub='',o={}){ const K=APPS[k]; return `<div class="abs app ${o.col?'col':''}" style="${st(x,y,o.w)}${o.css||''}"${an}><div class="ico" style="background:${K.bg}">${ICON[K.icon](K.fg)}</div><div><div class="nm" style="${o.fs?`font-size:${o.fs}px`:''}">${o.name||K.name}</div>${sub?`<div class="sb">${sub}</div>`:''}</div></div>`; }
function ico(name,x,y,sz,col,bg,an='',lbl=''){ return `<div class="abs" style="${st(x,y,sz)};text-align:center"${an}><div style="width:${sz}px;height:${sz}px;border-radius:${sz*.26}px;background:${bg};display:flex;align-items:center;justify-content:center;box-shadow:0 20px 50px rgba(0,0,0,.45)"><div style="width:${sz*.62}px;height:${sz*.62}px">${ICON[name](col)}</div></div>${lbl?`<div class="lbl" style="margin-top:14px;font-size:${Math.max(22,sz*.22)}px;margin-left:-60px;margin-right:-60px">${lbl}</div>`:''}</div>`; }
function tag(x,y,w,h,big,sub,an,o={}){ const sl=o.sl||420; return `<div class="abs sway" data-sw="${o.sw||2.2}" style="${st(x,y-sl,w,h+sl)};transform-origin:50% 0"${an}><div class="abs" style="left:${w/2-2}px;top:0;width:4px;height:${sl+30}px;background:linear-gradient(#6E7064,#9A9C8E)"></div><div class="abs ptag" style="${st(0,sl,w,h)};background:${o.bg||'linear-gradient(170deg,#F7EFDD,#E4D4B2)'}"><div class="hole"></div><div class="pbig" style="color:${o.fg||'#12130F'};${o.fs?`font-size:${o.fs}px`:''}">${big}</div><div class="psub">${sub}</div></div></div>`; }
const pill=(x,y,txt,k,an='',css='')=>`<div class="pill ${k}" style="left:${x}px;top:${y}px;${css}"${an}>${txt}</div>`;
const big=(x,y,txt,fs,col,an='',css='')=>`<div class="abs bt" style="left:${x}px;top:${y}px;font-size:${fs}px;color:${col};${css}"${an}>${txt}</div>`;
const txt=(x,y,t,fs,col,an='',css='')=>`<div class="abs lbl" style="left:${x}px;top:${y}px;font-size:${fs}px;color:${col};${css}"${an}>${t}</div>`;
function paper(x,y,w,h,title,n,an='',o={}){ const r=rng(o.seed||3); let s=''; for(let i=0;i<n;i++) s+=`<div class="ln" style="width:${(55+r()*40)|0}%;${o.hl&&o.hl.includes(i)?'background:#CBBF9F':''}"></div>`; return `<div class="abs paper" style="${st(x,y,w,h)}${o.css||''}"${an}>${title?`<div class="ttl">${title}</div>`:''}${s}${o.inner||''}</div>`; }
function win(x,y,w,h,title,inner,an='',css=''){ return `<div class="abs win" style="${st(x,y,w,h)}${css}"${an}><div class="bar"><b></b><b></b><b></b><span style="margin-left:14px">${title}</span></div><div class="abs" style="left:0;top:58px;right:0;bottom:0">${inner}</div></div>`; }
function phone(x,y,w,h,inner,an='',css=''){ return `<div class="abs" style="${st(x,y,w,h)};border-radius:${w*.14}px;background:#0B0C0A;border:3px solid #33352E;box-shadow:0 50px 110px rgba(0,0,0,.7);${css}"${an}><div class="abs" style="left:12px;top:12px;right:12px;bottom:12px;border-radius:${w*.12}px;background:linear-gradient(#1D2019,#14160F);overflow:hidden"><div class="abs" style="left:50%;top:16px;width:${w*.26}px;height:26px;margin-left:${-w*.13}px;border-radius:14px;background:#000"></div>${inner}</div></div>`; }
const bub=(x,y,w,t,me,an='',css='')=>`<div class="bub ${me?'me':''}" style="left:${x}px;top:${y}px;width:${w}px;${css}"${an}>${t}</div>`;
const tbox=(x,y,w,t,at,dur,css='',an2='')=>`<div class="tbox" style="left:${x}px;top:${y}px;width:${w}px;${css}"${an2}><span${A(at,'type',`data-txt="${t.replace(/"/g,'&quot;')}" data-dur="${dur}"`)}></span></div>`;
function meter(x,y,w,at,pct,col,dur=1.2,lbl=''){ return `<div class="track" style="left:${x}px;top:${y}px;width:${w}px"><div class="fl" style="background:${col}"${A(at,'fill',`data-w="${pct}" data-d="${dur}"`)}></div></div>${lbl}`; }
const strike=(x,y,w,at,rot=0)=>`<div class="strike" style="left:${x}px;top:${y}px;width:${w}px;transform:rotate(${rot}deg)"${A(at,'strike',`data-r="${rot}"`)}></div>`;
function clock(x,y,r,lbl,at,col='#C8F031',spin=40){ const tk=[...Array(12).keys()].map(i=>`<path d="M${r} ${r*.16}V${r*.3}" stroke="#8E907F" stroke-width="5" stroke-linecap="round" transform="rotate(${i*30} ${r} ${r})"/>`).join('');

EV.push({t:specT(NS,'Bitrucos')-0.1,type:'ding'});
EV.sort((a,b)=>a.t-b.t);
{ const f=[]; let last={}; for(const e of EV){ if(last[e.type]!=null && e.t-last[e.type]<0.09) continue; f.push(e); last[e.type]=e.t; } window.EV=f; }

function applyAnim(o,t){ const {el,a,t0,d}=o; const p=P(t,t0,d); let tr='', op=1;
  if(HIDE.has(a) && t<t0){ el.style.opacity=0; return; }
  switch(a){
   case 'spawn': { const b=back(p); op=Math.min(1,p*2.4); tr=`translateY(${(1-b)*44}px) scale(${.9+.1*b})`; break; }
   case 'pop': tr=`scale(${back(p,2)})`; break;
   case 'drop': { const b=back(p,1.2); tr=`translateY(${(1-b)*-620}px)`; break; }
   case 'rise': { const b=back(p,1.1); tr=`translateY(${(1-b)*400}px)`; break; }
   case 'slideL': tr=`translateX(${(1-eo(p))*-260}px)`; op=p; break;
   case 'slideR': tr=`translateX(${(1-eo(p))*260}px)`; op=p; break;
   case 'fade': op=p; break;
   case 'stamp': op=Math.min(1,p*3); tr=`scale(${2.2-1.2*eo(p)}) rotate(${-14*(1-p)}deg)`; break;
   case 'type': { const n=Math.round(o.txt.length*p); const blink=p<1||Math.floor(t*2.4)%2===0; el.innerHTML=o.txt.slice(0,n).replace(/</g,'&lt;')+(blink&&t<t0+d+1.6?'<span class="caret"></span>':''); el.style.opacity=1; return; }
   case 'fill': el.style.width=(eio(p)*o.w)+'%'; return;
   case 'fill2': op=p; tr=`scaleY(${.2+.8*eo(p)})`; el.style.transformOrigin='50% 0'; break;
   case 'strike': el.style.transform=`rotate(${o.r}deg) scaleX(${eo(p)})`; return;
   case 'gray': el.style.filter=`grayscale(${p}) brightness(${1-.45*p})`; el.style.opacity=1-.35*p; return;
   case 'flash': el.style.opacity=t<t0?0:(1-eo(p))*.9; return;
   case 'rot': el.style.transform=`rotate(${o.from+(o.to-o.from)*back(p,1.2)}deg)`; return;
   case 'tilt': el.style.transform=`rotate(${o.to*eio(p)+Math.sin(t*1.4)*.6}deg)`; return;
  }
  if(o.out!=null) op*=1-P(t,o.out,.35);
  const fl=Math.sin(t*1.05+o.i*1.7)*4;
  el.style.opacity=op; el.style.transform=`${tr} translateY(${fl}px) rotate(${o.r}deg)`; }

// subtítulos karaoke
const KEY=/^(chatgpt|claude|gemini|gratis|límite|anuncios|prueba|errores|plan|go|plus|max|ultra|terabytes|bitrucos|google)$/i;
const SEGS=[]; L.forEach(l=>l.segs.forEach(sg=>{ const words=sg.show.split(/\s+/); let pos=0; const ws=words.map((w,k)=>{ const a=sg.ws?sg.ws[k]:sg.start+(sg.end-sg.start)*(pos/sg.show.length); pos+=w.length+1; return {w,a,k:KEY.test(w.replace(/[«»“”".,:;!?¿¡]/g,''))}; }); SEGS.push({a:sg.start,b:sg.end,ws}); }));
const CAPEND=SEGS[SEGS.length-1].b+.8; let capKey='';
function renderCap(t){ const el=$('cap'); if(t<0.7||t>CAPEND){ if(capKey){el.innerHTML='';capKey='';} return; }
  let s=null; for(const sg of SEGS) if(sg.a-0.05<=t) s=sg; if(!s||t>s.b+1.2){ if(capKey){el.innerHTML='';capKey='';} return; }
  const n=s.ws.filter(w=>w.a<=t+0.03).length; const key=s.a+':'+n; if(key===capKey) return; capKey=key;
  el.innerHTML='<div>'+s.ws.map((w,i)=>{ const vis=i<n; const now=i===n-1; const box=(w.k&&vis)?'<span class="box"><b style="left:-7px;top:-7px"></b><b style="right:-7px;top:-7px"></b><b style="left:-7px;bottom:-7px"></b><b style="right:-7px;bottom:-7px"></b></span>':'';
    return `<span class="w${now?' now':''}${w.k?' k':''}" style="opacity:${vis?1:.28}">${box}<span style="position:relative">${w.w}</span></span>`; }).join(' ')+'</div>'; }

function render(t){
  $('prog').style.width=(t/D*1920)+'px'; dustFrame(t);
  for(let s=1;s<=NS;s++){ const el=$('s'+s), a=sceneStart[s], b=sceneEnd[s];
    if(t<a||t>=b+0.5){ el.style.visibility='hidden'; continue; } el.style.visibility='visible'; el.style.zIndex=s;
    const pin=s===1?1:eo(P(t,a,0.5)); const pout=s<NS?P(t,b,0.5):0;
    el.style.opacity=pin; el.style.filter=(pin<1||pout>0)?`blur(${(1-pin)*16+pout*10}px)`:'none';
    const k=clamp((t-a)/(b-a+0.5));
    $('c'+s).style.transform=`scale(${(1.04-0.04*pin)*(1+0.05*k)}) translate(${Math.sin(t*.4+s)*6}px,${-10*k+Math.cos(t*.33+s)*4}px)`;
    bokehFrame('b'+s,t);
    const ch=$('ch'+s); if(ch){ const p=P(t,a+0.45,.35); ch.style.opacity=p; ch.style.transform=`translateY(${(1-eo(p))*-20}px)`; }
    for(const o of AN[s]) applyAnim(o,t);
    el.querySelectorAll('.sway').forEach(e=>{ if(+e.style.opacity===0) return; const sw=+(e.dataset.sw||2); e.style.transform+=` rotate(${Math.sin(t*1.3+(+e.dataset.si))*sw}deg)`; });
    el.querySelectorAll('.spin').forEach(e=>{ e.style.transform=`rotate(${t*(+e.dataset.spin)}deg)`; });
    el.querySelectorAll('.flk').forEach((e,i)=>{ e.style.opacity=.85+.15*Math.sin(t*2.1+i*1.3)*Math.sin(t*.7+i); });
    el.querySelectorAll('.twk').forEach((e,i)=>{ if(i%5===0) e.style.opacity=.25+.35*(.5+.5*Math.sin(t*1.6+i)); });
    el.querySelectorAll('.leaf').forEach((e,i)=>{ e.style.transform=`rotate(${Math.sin(t*.9+i)*1.6}deg)`; e.style.transformOrigin='50% 100%'; });
    el.querySelectorAll('.neon').forEach(e=>{ const f=Math.sin(t*13)>.96?.55:1; e.style.filter=`brightness(${f})`; });
    el.querySelectorAll('.spark').forEach(e=>{ e.style.transform=`rotate(${t*40}deg) scale(${1+.15*Math.sin(t*4)})`; });
  }
  { const c=$('cover'); const o=QS.has('thumb')?1:1-clamp((t-0.55)/0.3); c.style.opacity=o; c.style.visibility=o<=0?'hidden':'visible'; }
  if(QS.has('thumb')){ $('cap').innerHTML=''; $('prog').style.width='0'; return; }
  renderCap(t);
}
window.render=render;
document.fonts.ready.then(()=>{ render(0); window.READY=true; });
